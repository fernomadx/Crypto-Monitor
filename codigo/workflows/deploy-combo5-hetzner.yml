# Deploy COMBO5 (+ /combo5) to Hetzner VPS

name: Deploy COMBO5 to Hetzner

on:
  workflow_dispatch:
    inputs:
      vps_host:
        description: "IPv4 Hetzner (opcional se secret VPS_HOST existir)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - vps/combo5_signal.py
      - vps/quant_bot.py
      - lib/combo5/**
      - scripts/hetzner-deploy-combo5.sh
      - scripts/hetzner-heal-bots.sh
      - vps/hetzner_bootstrap_combo5.sh
      - .github/workflows/deploy-combo5-hetzner.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: "faithful-determination / production"
    steps:
      - uses: actions/checkout@v4

      - name: Deploy COMBO5 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.event.inputs.vps_host || secrets.VPS_HOST || '204.168.179.200' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            export REPO_DIR=/opt/crypto-monitor
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR" && git fetch origin && git reset --hard origin/main
              bash scripts/hetzner-deploy-combo5.sh
            else
              curl -fsSL https://raw.githubusercontent.com/fernomadx/Crypto-Monitor/main/scripts/hetzner-deploy-combo5.sh | bash
            fi

      - name: SSH key missing
        if: failure()
        run: |
          echo "::error::SSH falhou — cole na Console Hetzner:"
          echo "curl -fsSL https://raw.githubusercontent.com/fernomadx/Crypto-Monitor/main/scripts/hetzner-deploy-combo5.sh | sudo bash"

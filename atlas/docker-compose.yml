services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      # Bind localhost only — never expose Postgres to the public internet
      - "127.0.0.1:5432:5432"
    volumes:
      - atlas_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@db:5432/atlas
      ATLAS_HOST: 0.0.0.0
      ATLAS_PORT: 8080
      ATLAS_ENV: development
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  atlas_pg:

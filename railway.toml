[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "always"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 30
# Redeploy: Kronos daemon alerta 1H no fechamento do candle
# PORT 8080 + domínio público + webhook Telegram — /ping e /scorecard no Railway

# Volume montado em /data — configure no painel Railway:
# Settings → Volumes → Mount Path: /data
